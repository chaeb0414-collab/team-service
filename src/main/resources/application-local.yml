spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:teamdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: info

info:
  team-name: local-team